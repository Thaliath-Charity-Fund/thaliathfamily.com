# .github/workflows/pre-commit.yml
name: Pre-commit

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v3
        with:
          python-version: "3.x"

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: "--all-files"
